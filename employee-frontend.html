<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Employee Management</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0f0f11;
    --surface: #1a1a1f;
    --surface2: #23232a;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --green: #3ecf8e;
    --text: #f0f0f5;
    --muted: #7a7a8c;
    --border: #2e2e38;
    --radius: 14px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Header */
  header {
    padding: 28px 40px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }
  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  header h1 span { color: var(--accent); }
  .badge {
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  /* Layout */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 36px 24px;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 28px;
    align-items: start;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
  }
  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* Form */
  .form-group { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 0.3px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: #fff; margin-bottom: 10px; }
  .btn-warning { background: #f4a020; color: #fff; margin-bottom: 10px; }
  .btn-danger  { background: var(--accent2); color: #fff; }
  .btn:hover { opacity: 0.88; }

  /* Mode toggle */
  .mode-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 22px;
    background: var(--surface2);
    border-radius: 10px;
    padding: 4px;
  }
  .mode-btn {
    flex: 1;
    padding: 7px;
    border: none;
    border-radius: 7px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 28px; right: 28px;
    background: var(--green);
    color: #0a2e1e;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.error { background: var(--accent2); color: #fff; }

  /* Employee Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    text-align: left;
    padding: 10px 14px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  tbody tr:hover { background: var(--surface2); }
  tbody td { padding: 13px 14px; color: var(--text); }
  .id-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 12px;
    color: var(--muted);
    font-family: monospace;
  }
  .dept-tag {
    background: rgba(108,99,255,0.15);
    color: #a89fff;
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 12px;
    font-weight: 500;
  }
  .action-btn {
    border: none;
    border-radius: 6px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: opacity 0.15s;
  }
  .action-btn:hover { opacity: 0.75; }
  .edit-btn { background: rgba(244,160,32,0.15); color: #f4a020; margin-right: 6px; }
  .del-btn  { background: rgba(255,101,132,0.15); color: var(--accent2); }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
    font-size: 14px;
  }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }

  /* Refresh btn */
  .refresh-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
    margin-left: auto;
    display: block;
    margin-bottom: 16px;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Divider */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 18px 0;
  }

  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
    header { padding: 18px 20px; }
  }
</style>
</head>
<body>

<header>
  <h1>Employee <span>Manager</span></h1>
  <span class="badge">Spring Boot Connected</span>
</header>

<div class="container">

  <!-- LEFT: Form Panel -->
  <div class="card">
    <div class="card-title"><span class="dot"></span> Manage Employee</div>

    <div class="mode-bar">
      <button class="mode-btn active" onclick="setMode('add')">➕ Add</button>
      <button class="mode-btn" onclick="setMode('update')">✏️ Update</button>
      <button class="mode-btn" onclick="setMode('delete')">🗑️ Delete</button>
    </div>

    <!-- Add Form -->
    <div id="form-add">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="add-name" placeholder="e.g. Rahul Sharma"/>
      </div>
      <div class="form-group">
        <label>Department</label>
        <input type="text" id="add-dept" placeholder="e.g. Engineering"/>
      </div>
      <div class="form-group">
        <label>Salary</label>
        <input type="number" id="add-salary" placeholder="e.g. 50000"/>
      </div>
      <button class="btn btn-primary" onclick="addEmployee()">Add Employee</button>
    </div>

    <!-- Update Form -->
    <div id="form-update" style="display:none">
      <div class="form-group">
        <label>Employee ID</label>
        <input type="number" id="upd-id" placeholder="ID to update"/>
      </div>
      <div class="form-group">
        <label>New Name</label>
        <input type="text" id="upd-name" placeholder="New name"/>
      </div>
      <div class="form-group">
        <label>New Department</label>
        <input type="text" id="upd-dept" placeholder="New department"/>
      </div>
      <div class="form-group">
        <label>New Salary</label>
        <input type="number" id="upd-salary" placeholder="New salary"/>
      </div>
      <button class="btn btn-warning" onclick="updateEmployee()">Update Employee</button>
    </div>

    <!-- Delete Form -->
    <div id="form-delete" style="display:none">
      <div class="form-group">
        <label>Employee ID</label>
        <input type="number" id="del-id" placeholder="ID to delete"/>
      </div>
      <button class="btn btn-danger" onclick="deleteEmployee()">Delete Employee</button>
    </div>
  </div>

  <!-- RIGHT: Employee List -->
  <div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
      <div class="card-title" style="margin-bottom:0"><span class="dot" style="background:var(--green)"></span> All Employees</div>
      <button class="refresh-btn" style="margin:0" onclick="loadEmployees()">↻ Refresh</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="emp-table-body">
          <tr><td colspan="5"><div class="empty"><div class="empty-icon">📋</div>Loading employees...</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast"></div>

<script>
  const API = 'http://localhost:8080';

  // ── Load Employees ──────────────────────────────
  async function loadEmployees() {
    try {
      const res = await fetch(`${API}/employees`);
      const data = await res.json();
      const tbody = document.getElementById('emp-table-body');

      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="5"><div class="empty"><div class="empty-icon">🙈</div>No employees found. Add one!</div></td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(emp => `
        <tr>
          <td><span class="id-badge">#${emp.id}</span></td>
          <td>${emp.name}</td>
          <td><span class="dept-tag">${emp.department}</span></td>
          <td>₹${Number(emp.salary).toLocaleString('en-IN')}</td>
          <td>
            <button class="action-btn edit-btn" onclick="prefillUpdate(${emp.id},'${emp.name}','${emp.department}',${emp.salary})">Edit</button>
            <button class="action-btn del-btn" onclick="quickDelete(${emp.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      showToast('❌ Cannot connect to Spring Boot! Make sure it is running on port 8080.', true);
    }
  }

  // ── Add Employee ────────────────────────────────
  async function addEmployee() {
    const name       = document.getElementById('add-name').value.trim();
    const department = document.getElementById('add-dept').value.trim();
    const salary     = document.getElementById('add-salary').value;

    if (!name || !department || !salary) { showToast('⚠️ Saare fields bharo!', true); return; }

    try {
      const res = await fetch(`${API}/addemployee`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, department, salary: Number(salary) })
      });
      const msg = await res.text();
      showToast('✅ ' + msg);
      document.getElementById('add-name').value = '';
      document.getElementById('add-dept').value = '';
      document.getElementById('add-salary').value = '';
      loadEmployees();
    } catch (e) {
      showToast('❌ Server se connect nahi ho pa raha!', true);
    }
  }

  // ── Update Employee ─────────────────────────────
  async function updateEmployee() {
    const id         = document.getElementById('upd-id').value;
    const name       = document.getElementById('upd-name').value.trim();
    const department = document.getElementById('upd-dept').value.trim();
    const salary     = document.getElementById('upd-salary').value;

    if (!id || !name || !department || !salary) { showToast('⚠️ Saare fields bharo!', true); return; }

    try {
      const res = await fetch(`${API}/updateemployee/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, department, salary: Number(salary) })
      });
      const msg = await res.text();
      showToast('✅ ' + msg);
      loadEmployees();
    } catch (e) {
      showToast('❌ Update fail ho gaya!', true);
    }
  }

  // ── Delete Employee ─────────────────────────────
  async function deleteEmployee() {
    const id = document.getElementById('del-id').value;
    if (!id) { showToast('⚠️ ID daalo!', true); return; }
    quickDelete(id);
  }

  async function quickDelete(id) {
    if (!confirm(`Employee #${id} ko delete karna chahte ho?`)) return;
    try {
      const res = await fetch(`${API}/deleteemployee/${id}`, { method: 'DELETE' });
      const msg = await res.text();
      showToast('🗑️ ' + msg);
      loadEmployees();
    } catch (e) {
      showToast('❌ Delete fail ho gaya!', true);
    }
  }

  // ── Prefill Update Form ─────────────────────────
  function prefillUpdate(id, name, dept, salary) {
    setMode('update');
    document.getElementById('upd-id').value     = id;
    document.getElementById('upd-name').value   = name;
    document.getElementById('upd-dept').value   = dept;
    document.getElementById('upd-salary').value = salary;
  }

  // ── Mode Toggle ─────────────────────────────────
  function setMode(mode) {
    ['add','update','delete'].forEach(m => {
      document.getElementById(`form-${m}`).style.display = m === mode ? 'block' : 'none';
    });
    document.querySelectorAll('.mode-btn').forEach((btn, i) => {
      btn.classList.toggle('active', ['add','update','delete'][i] === mode);
    });
  }

  // ── Toast ───────────────────────────────────────
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show' + (isError ? ' error' : '');
    setTimeout(() => { t.className = ''; }, 3000);
  }

  // Load on start
  loadEmployees();
</script>
</body>
</html>
